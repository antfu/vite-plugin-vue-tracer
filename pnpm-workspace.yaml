catalogMode: prefer
ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalogs:
  dev:
    '@antfu/eslint-config': ^7.7.2
    '@antfu/ni': ^28.3.0
    '@antfu/utils': ^9.3.0
    '@types/node': ^25.5.0
    '@unocss/preset-mini': ^66.6.6
    '@unocss/reset': ^66.6.6
    '@vitejs/devtools': ^0.1.0
    '@vitejs/devtools-kit': ^0.1.0
    '@vitejs/plugin-vue': ^6.0.5
    baseline-browser-mapping: ^2.10.7
    bumpp: ^10.4.1
    eslint: ^10.0.3
    nano-staged: ^0.9.0
    simple-git-hooks: ^2.13.1
    tsx: ^4.21.0
    typescript: ^5.9.3
    unbuild: ^3.6.1
    unocss: ^66.6.6
    vite: ^8.0.0
    vite-plugin-inspect: ^11.3.3
    vitest: ^4.1.0
    vue: ^3.5.30
    vue-tsc: ^3.2.5
  frontend:
    nanoevents: ^9.1.0
  prod:
    estree-walker: ^3.0.3
    exsolve: ^1.0.8
    magic-string: ^0.30.21
    pathe: ^2.0.3
    source-map-js: ^1.2.1
onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - unrs-resolver
